name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: events
          POSTGRES_USER: events_user
          POSTGRES_PASSWORD: events_password
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U events_user -d events"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+psycopg2://events_user:events_password@localhost:5435/events
          EVENTS_PROVIDER_URL: https://events-provider.dev-2.python-labs.ru
          EVENTS_PROVIDER_API_KEY: test-api-key
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest
  deploy:
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/evgenyfedorov1996/events-aggregator:${{ github.sha }}

      - name: Deploy to LMS
        run: |
          curl -X POST \
            -H "X-API-Key: ${{ secrets.LMS_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "image": "ghcr.io/evgenyfedorov1996/events-aggregator:${{ github.sha }}"
            }' \
            https://lms.python-labs.ru/api/deploy-requests
